services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in your deployment environment}
      API_WRITE_KEY: ${API_WRITE_KEY:?Set API_WRITE_KEY in your deployment environment}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_API_URL: http://api:5000/api
      API_WRITE_KEY: ${API_WRITE_KEY:?Set API_WRITE_KEY in your deployment environment}
    ports:
      - "${WEB_PORT:-3000}:3000"
